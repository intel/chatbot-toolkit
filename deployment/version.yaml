schema: 1
layer: erag
solution_version: 3.1.0
upgrade_base_version: ">=3.0.0,<3.1.0"

# Versions of the layers below and of Toolkit Manager this release runs on.
# platform and installer are Toolkit Manager's VERSION. This release ships with
# Toolkit Manager 2.0.0, whose VERSION reads 1.1.0 until its release commit, so
# the range admits both.
requires:
  platform: ">=1.1.0,<2.1.0"
  inference: ">=1.1.0,<1.3.0"
  installer: ">=1.1.0,<2.1.0"

# Container image tag used when the configuration does not set one, and whether
# an unpinned/mismatched tag is checked against solution_version. Between
# releases (no images published yet for this solution_version): "main", override
# on, so a floating tag is not blocked. A release commit sets default_image_tag
# to the release version and default_tag_override to false, so a mismatched tag
# blocks again.
default_image_tag: "main"
default_tag_override: true
