schema: 1
layer: erag
solution_version: 3.0.0
# Versions an existing deployment may be upgraded from, checked by
# app_deployment_manifest. This first release accepts any 3.0.x patch release.
upgrade_base_version: ">=3.0.0,<3.1.0"

# Versions of the layers below and of Toolkit Manager this release runs on.
# platform and installer are Toolkit Manager's VERSION.
requires:
  platform: ">=1.1.0,<1.3.0"
  inference: ">=1.1.0,<1.2.0"
  installer: ">=1.1.0,<1.3.0"

# Container image tag used when the configuration does not set one. Kept equal
# to solution_version.
default_image_tag: "3.0.0"
