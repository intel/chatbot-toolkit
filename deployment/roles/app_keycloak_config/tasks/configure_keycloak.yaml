---
# Job-based Keycloak configuration - runs inside the cluster, no port-forward needed

- name: "app_keycloak_config | Set per-run configurator variables"
  ansible.builtin.set_fact:
    minio_domain: "{{ edp_minio_domain_name }}"
    minio_path_prefix: "{{ edp_seaweedfs_path_prefix | default('') }}"
    ui_domain: "{{ ui_domain_name }}"
    credentials_secret_name: "chattool-credentials"
    configurator_job_name: "keycloak-configurator-{{ ansible_date_time.epoch }}"

# Its account stays after the Job; teardown deletes it.
- name: "app_keycloak_config | Run the configurator Job"
  ansible.builtin.include_tasks: _run_admin_api_job.yaml
  vars:
    _kc_job_app: keycloak-configurator
    _kc_job_name: "{{ configurator_job_name }}"
    _kc_job_template: configurator-job.yaml.j2
    _kc_job_failed_msg: "Keycloak configurator Job {{ configurator_job_name }} failed. Check the output above."

- name: "app_keycloak_config | Clean up sensitive credentials secret"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: keycloak-configurator-sensitive
    namespace: "{{ keycloak_namespace }}"
  when: (chattool_keycloak_oidc_endpoint | default('') | length > 0) or (chattool_keycloak_federation_endpoint | default('') | length > 0)
  failed_when: false

- name: "app_keycloak_config | Read chattool-credentials secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ credentials_secret_name }}"
    namespace: "{{ keycloak_namespace }}"
  register: chattool_credentials_secret
  no_log: "{{ secure_logs }}"

- name: "app_keycloak_config | Write default_credentials.txt from chattool-credentials secret"
  ansible.builtin.copy:
    dest: "{{ rag_log_dir }}/default_credentials.txt"
    mode: '0600'
    content: |
      KEYCLOAK_CHATTOOL_ADMIN_USERNAME={{ chattool_credentials_secret.resources[0].data['KEYCLOAK_CHATTOOL_ADMIN_USERNAME'] | b64decode }}
      KEYCLOAK_CHATTOOL_ADMIN_PASSWORD="{{ chattool_credentials_secret.resources[0].data['KEYCLOAK_CHATTOOL_ADMIN_PASSWORD'] | b64decode }}"
      KEYCLOAK_CHATTOOL_USER_USERNAME={{ chattool_credentials_secret.resources[0].data['KEYCLOAK_CHATTOOL_USER_USERNAME'] | b64decode }}
      KEYCLOAK_CHATTOOL_USER_PASSWORD="{{ chattool_credentials_secret.resources[0].data['KEYCLOAK_CHATTOOL_USER_PASSWORD'] | b64decode }}"
      KEYCLOAK_CHATTOOL_MAINTAINER_USERNAME={{ chattool_credentials_secret.resources[0].data['KEYCLOAK_CHATTOOL_MAINTAINER_USERNAME'] | b64decode }}
      KEYCLOAK_CHATTOOL_MAINTAINER_PASSWORD="{{ chattool_credentials_secret.resources[0].data['KEYCLOAK_CHATTOOL_MAINTAINER_PASSWORD'] | b64decode }}"
      {% if mcp_enabled | default(false) | bool and chattool_credentials_secret.resources[0].data['MCP_CLIENT_SECRET'] is defined %}
      MCP_CLIENT_ID={{ chattool_credentials_secret.resources[0].data['MCP_CLIENT_ID'] | b64decode }}
      MCP_CLIENT_SECRET="{{ chattool_credentials_secret.resources[0].data['MCP_CLIENT_SECRET'] | b64decode }}"
      {% endif %}
  no_log: "{{ secure_logs }}"
  when: chattool_credentials_secret.resources | length > 0

# Grafana's Keycloak sign-in uses the platform realm's first admin; absent when the platform creates none.
- name: "app_keycloak_config | install | Read the platform admin's password"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: platform-bootstrap-admin
    namespace: "{{ keycloak_namespace }}"
  register: _app_keycloak_config_platform_admin
  no_log: "{{ secure_logs | default(true) | bool }}"

- name: "app_keycloak_config | install | Add the platform admin to default_credentials.yaml"
  ansible.builtin.lineinfile:
    path: "{{ rag_log_dir }}/default_credentials.yaml"
    regexp: "^{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
    create: true
    mode: "0600"
  loop:
    # Foreign: owned by keycloak (Toolkit Manager)
    - {key: PLATFORM_ADMIN_USERNAME, value: "{{ keycloak_platform_bootstrap_admin_user | default('platform-admin') }}"}
    - {key: PLATFORM_ADMIN_PASSWORD, value: "{{ ((_app_keycloak_config_platform_admin.resources | first | default({})).data | default({})).value | default('') | b64decode }}"}
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ secure_logs | default(true) | bool }}"
  when: _app_keycloak_config_platform_admin.resources | default([]) | length > 0

- name: "app_keycloak_config | install | Remove the Grafana SSO earlier releases injected"
  ansible.builtin.include_tasks: _remove_grafana_sso.yaml
