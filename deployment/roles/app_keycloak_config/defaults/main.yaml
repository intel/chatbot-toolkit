---
# =============================================================================
# app_keycloak_config Role Defaults
# =============================================================================
# Configuration overlay for the Keycloak instance deployed by core/keycloak.
# This role does NOT deploy Keycloak; it only configures realm/clients/users
# inside an already-running Keycloak (via an in-cluster Job for upgrade
# safety).
#
# Variable ownership:
#   chattool_keycloak_* — this role's own realm/client/domain/OIDC/federation
#     config. Prefixed to avoid shadowing core/keycloak and inference's
#     keycloak_realm / keycloak_client_id when they share a playbook.
#   keycloak_*     — shared, owned by core/keycloak (namespace, admin user,
#     admin secret). This role reads them; it does not define their meaning.

# --- Realm + domain ---
chattool_keycloak_realm: "ChatbotToolkit"
chattool_keycloak_domain_name: "{{ (base_domain_name | default('solutions.ai')) if (routing_mode | default('subdomain')) == 'path' else 'keycloak.' ~ (base_domain_name | default('solutions.ai')) }}"
# Must match where the platform serves Keycloak in path mode (keycloak role: keycloak_path,
# default /keycloak); a different prefix breaks every issuer URL.
chattool_keycloak_default_path_prefix: "{{ keycloak_path | default('/keycloak') }}"
chattool_keycloak_path_prefix: "{{ chattool_keycloak_default_path_prefix if (routing_mode | default('subdomain')) == 'path' else '' }}"

# --- Client registration (used by get_secret_id.yaml) ---
chattool_keycloak_client_id: "ChatbotToolkit-oidc-backend"

# --- MCP gateway caller identity (service account, client_credentials only) ---
mcp_keycloak_client_id: "mcp-client"
mcp_jwt_audience: "mcp-gateway"
mcp_access_token_lifespan: 900

# --- Admin secret + namespace fallbacks (core/keycloak owns these at
#     the playbook level; values default to the core defaults for
#     standalone use). ---
keycloak_admin_secret_name: "keycloak-admin-secret"

keycloak_namespace: "keycloak"
keycloak_admin_user: "admin"

chattool_keycloak_oidc_endpoint: ""
chattool_keycloak_oidc_alias: "enterprise-sso"
chattool_keycloak_oidc_client_id: ""
chattool_keycloak_oidc_client_secret: ""
chattool_keycloak_oidc_admin_gid: ""
chattool_keycloak_oidc_maintainer_gid: ""
chattool_keycloak_oidc_user_gid: ""
chattool_keycloak_oidc_tenant_id: ""

# --- LDAP federation (optional; all-empty = disabled) ---
chattool_keycloak_federation_endpoint: ""
chattool_keycloak_federation_bind_dn: ""
chattool_keycloak_federation_bind_password: ""
chattool_keycloak_federation_users_dn: ""
chattool_keycloak_federation_user_attribute: "sAMAccountName"
chattool_keycloak_federation_groups_dn: ""
chattool_keycloak_federation_user_group_ldap_filter: "(cn=chattool-user-group)"
chattool_keycloak_federation_maintainer_group_ldap_filter: "(cn=chattool-maintainer-group)"
chattool_keycloak_federation_admin_group_ldap_filter: "(cn=chattool-admin-group)"

# --- Cross-role shared defaults - Owned by other roles; declared here so this role is standalone-runnable. ---
edp_minio_domain_name: "seaweedfs.{{ base_domain_name | default('solutions.ai') }}"      # app_edp
edp_seaweedfs_path_prefix: ""  # app_edp
ui_domain_name: "{{ base_domain_name | default('solutions.ai') }}"      # app_ui
rag_log_dir: "{{ log_dir }}/rag"                   # app_pre_install (derived from log_dir)
rag_tmp_dir: "{{ tmp_dir }}/rag"                   # app_pre_install (derived from tmp_dir)
secure_logs: true                                  # global
mcp_enabled: false                                 # pipelines/<flavour>/config.yaml
