---
# Compare a pre-upgrade and a post-upgrade data snapshot.
# Expects: _upgrade_pre_snapshot, _upgrade_post_snapshot (dicts produced by snapshot.yaml)
# Sets fact: _upgrade_consistency_result

- name: "app_data_consistency | Compare — initialize"
  ansible.builtin.set_fact:
    _dc_stores: {}
    _dc_violations: []

# snapshot.yaml stops the run when a store cannot be counted before the upgrade, so
# only the count after it can have failed. That store is treated as lost.
- name: "app_data_consistency | Compare — each store counted after the upgrade"
  ansible.builtin.set_fact:
    _dc_stores: >-
      {{ _dc_stores | combine({item: {
           'pre': pre | int,
           'post': (none if post_status == 'failed' else post | int),
           'delta': (none if post_status == 'failed' else (post | int) - (pre | int)),
           'verdict': verdict}}) }}
    _dc_violations: >-
      {{ _dc_violations
         + ([item ~ ': decreased from ' ~ pre ~ ' to ' ~ post] if verdict == 'violation' else [])
         + ([item ~ ': counted ' ~ pre ~ ' before the upgrade but not after it: '
             ~ _upgrade_post_snapshot[item].reason] if verdict == 'lost' else []) }}
  vars:
    pre: "{{ _upgrade_pre_snapshot.get(item, {}).get('count', 0) | int }}"
    post: "{{ (_upgrade_post_snapshot[item].count or 0) | int }}"
    pre_status: "{{ _upgrade_pre_snapshot.get(item, {}).get('status', 'skipped') }}"
    post_status: "{{ _upgrade_post_snapshot[item].status }}"
    verdict: >-
      {{ 'skipped' if (pre_status == 'skipped' or post_status == 'skipped')
         else ('lost' if post_status == 'failed'
         else ('baseline' if (pre | int == 0 and post | int == 0)
         else ('violation' if (post | int < pre | int) else 'pass'))) }}
  loop: "{{ ['vdb', 'chat_history', 'edp', 'keycloak'] | select('in', _upgrade_post_snapshot) | list }}"

- name: "app_data_consistency | Compare — assemble result"
  ansible.builtin.set_fact:
    _upgrade_consistency_result:
      stores: "{{ _dc_stores }}"
      violations: "{{ _dc_violations }}"
      verdict: "{{ 'fail' if (_dc_violations | length > 0) else 'pass' }}"
      timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: "app_data_consistency | Compare — log results"
  ansible.builtin.debug:
    msg: >-
      [UPGRADE] Data consistency: {{ _upgrade_consistency_result.verdict | upper }}.
      Stores: {{ _dc_stores.keys() | list | join(', ') }}.
      {% if _dc_violations | length > 0 %}Violations: {{ _dc_violations | join('; ') }}{% endif %}

- name: "app_data_consistency | Compare — warn on violations"
  ansible.builtin.debug:
    msg: >-
      [UPGRADE WARNING] Data consistency violations detected:
      {{ _dc_violations | join('; ') }}.
      The upgrade fails once the report is written, unless
      data_consistency_no_fail or force_install_mode is set.
  when: _dc_violations | length > 0
