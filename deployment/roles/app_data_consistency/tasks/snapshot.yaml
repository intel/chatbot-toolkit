---
# Count one data store: data_consistency_store is vdb, chat_history, edp or
# keycloak. Sets fact: _data_snapshot (that store's count, status, method, reason)
#
# Every store is optional. A namespace that is absent, a component that is
# disabled, a toggle the operator switched off, or a vector store this role
# cannot count is recorded as skipped together with the reason, never treated as
# empty. A store that is counted is counted by an in-cluster Job whose failure
# fails this count — a count is either measured or absent, never assumed.

- name: "app_data_consistency | Snapshot — check the store name"
  ansible.builtin.assert:
    that: data_consistency_store | default('') in ['vdb', 'chat_history', 'edp', 'keycloak']
    fail_msg: "data_consistency_store must be vdb, chat_history, edp or keycloak, got '{{ data_consistency_store | default('') }}'"
    quiet: true

- name: "app_data_consistency | Snapshot — initialize"
  ansible.builtin.set_fact:
    _data_snapshot: {}
    _snapshot_file_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

- name: "app_data_consistency | Snapshot — count {{ data_consistency_store }}"
  ansible.builtin.include_tasks: "snapshot_{{ data_consistency_store }}.yaml"

- name: "app_data_consistency | Snapshot — summary"
  ansible.builtin.debug:
    msg: >-
      [DATA SNAPSHOT] {{ data_consistency_store }}={{ _data_snapshot[data_consistency_store].count }}
      ({{ _data_snapshot[data_consistency_store].status }})
