---
_pipeline_post_renderer: ""
_pipeline_fixed_uids: true
_pipeline_hpa_provider: prometheus-adapter
_pipeline_service_ca: ""
# Callers of the GMC controller from outside the mesh: the apiserver calls the
# admission webhook. Only these ports accept plain TCP under STRICT.
_pipeline_gmc_out_of_mesh_callers:
  - {port: 9443}
_pipeline_gmc_network_policy: false
