---
_pipeline_post_renderer: "{{ role_path }}/../../scripts/openshift_post_renderer.py"
_pipeline_fixed_uids: false
_pipeline_hpa_provider: keda
_pipeline_service_ca: "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
# Callers of the GMC controller from outside the mesh, each admitted by the
# NetworkPolicy from its namespaces only: the apiserver (host network) calls the
# admission webhook, the user-workload Prometheus scrapes the metrics.
_pipeline_gmc_out_of_mesh_callers:
  - {port: 9443, namespace_labels: {policy-group.network.openshift.io/host-network: ""}}
  - {port: 8080, namespace_labels: {network.openshift.io/policy-group: monitoring}}
_pipeline_gmc_network_policy: true
# Ports only the kubelet's probes call, open to any source.
_pipeline_gmc_probe_ports: [8081]
