---
# The user-workload Prometheus scrapes from outside the STRICT mesh, so each workload in
# _post_install_metrics_exceptions (vars/<platform>.yaml) accepts plain TCP on its metrics
# port, from the monitoring namespaces and the kubelet's probes (which istio-cni SNATs to
# HOST_PROBE_SNAT_IP) only. Meshed traffic arrives on HBONE (15008).
- name: "app_post_install | mesh | Read the kubelet probes' source address from the IstioCNI"
  kubernetes.core.k8s_info:
    api_version: sailoperator.io/v1
    kind: IstioCNI
    name: default
  register: _mesh_istio_cni

# preflight doesn't cover the eRAG layer, so the role checks HOST_PROBE_SNAT_IP itself.
- name: "app_post_install | mesh | Note the kubelet probes' source address"
  ansible.builtin.set_fact:
    _post_install_probe_address: >-
      {{ _mesh_istio_cni.resources | map(attribute='spec.values.cni.env.HOST_PROBE_SNAT_IP', default='')
         | first | default('') }}

- name: "app_post_install | mesh | Check the kubelet probes' source address"
  ansible.builtin.assert:
    that: _post_install_probe_address | length > 0
    fail_msg: >-
      The IstioCNI 'default' does not set spec.values.cni.env.HOST_PROBE_SNAT_IP, which
      the metrics NetworkPolicies need to admit the kubelet's probes. Set it as the
      platform's OpenShift guide describes (docs/deploy/openshift.md, step 3).
    quiet: true

- name: "app_post_install | mesh | List the eRAG namespaces"
  kubernetes.core.k8s_info:
    kind: Namespace
    label_selectors:
      - erag-istio-protected=true
  register: _mesh_namespaces

- name: "app_post_install | mesh | List the pods each exception selects"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ item.namespace }}"
    label_selectors: "{{ item.pods.items() | map('join', '=') | list }}"
  loop: "{{ _post_install_metrics_exceptions
            | selectattr('namespace', 'in', _mesh_namespaces.resources | map(attribute='metadata.name') | list) }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  register: _mesh_pods

- name: "app_post_install | mesh | Keep the deployed workloads"
  ansible.builtin.set_fact:
    _mesh_deployed: "{{ _mesh_pods.results | selectattr('resources') | list }}"

# A chart that renames a pod label also lands here: its metrics stay unscraped.
- name: "app_post_install | mesh | Warn about the exceptions that select no pod"
  ansible.builtin.debug:
    msg: >-
      No pod matches these metrics exceptions, so they are skipped:
      {{ _mesh_skipped | join(', ') }}. If the workload is deployed, update its
      labels in _post_install_metrics_exceptions (app_post_install/vars/openshift.yaml).
  vars:
    _mesh_skipped: >-
      {%- set out = [] -%}
      {%- for r in _mesh_pods.results | rejectattr('resources') -%}
      {%- set _ = out.append(r.item.namespace ~ '/' ~ r.item.name) -%}
      {%- endfor -%}
      {{ out }}
  when: _mesh_skipped | length > 0

# The list is kept by hand: catch a chart that moved a port.
- name: "app_post_install | mesh | Check each deployed workload exposes its port"
  ansible.builtin.assert:
    that: >-
      item.item.port in (item.resources | map(attribute='spec.containers') | flatten
                         | map(attribute='ports', default=[]) | flatten
                         | map(attribute='containerPort') | list)
    fail_msg: >-
      No pod in {{ item.item.namespace }} with labels {{ item.item.pods }} exposes port
      {{ item.item.port }}. Update {{ item.item.name }} in
      _post_install_metrics_exceptions (app_post_install/vars/openshift.yaml).
    quiet: true
  loop: "{{ _mesh_deployed }}"
  loop_control:
    label: "{{ item.item.namespace }}/{{ item.item.name }} {{ item.item.port }}"

- name: "app_post_install | mesh | Open the metrics ports to the user-workload Prometheus"
  kubernetes.core.k8s:
    state: present
    definition:
      - apiVersion: security.istio.io/v1
        kind: PeerAuthentication
        metadata:
          name: "{{ item.name }}-metrics"
          namespace: "{{ item.namespace }}"
          labels: {erag-metrics-exception: "true"}
        spec:
          selector: {matchLabels: "{{ item.pods }}"}
          mtls: {mode: STRICT}
          portLevelMtls: "{{ {item.port | string: {'mode': 'PERMISSIVE'}} }}"
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: "{{ item.name }}-metrics"
          namespace: "{{ item.namespace }}"
          labels: {erag-metrics-exception: "true"}
        spec:
          podSelector: {matchLabels: "{{ item.pods }}"}
          policyTypes: [Ingress]
          ingress: "{{ _mesh_ingress }}"
  vars:
    _mesh_ingress: >-
      {%- set out = [{'ports': [{'port': 15008, 'protocol': 'TCP'}]}] -%}
      {%- for p in item.probe_ports | default([]) -%}
      {%- set _ = out.append({'ports': [{'port': p, 'protocol': 'TCP'}]}) -%}
      {%- endfor -%}
      {%- set _ = out.append({'from': [{'namespaceSelector': {'matchLabels': {'network.openshift.io/policy-group': 'monitoring'}}}]
                                      + ([{'ipBlock': {'cidr': _post_install_probe_address ~ '/32'}}] if item.probed | default(false) else []),
                              'ports': [{'port': item.port, 'protocol': 'TCP'}]}) -%}
      {{ out }}
  loop: "{{ _mesh_deployed | map(attribute='item') | list }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }} {{ item.port }}"

- name: "app_post_install | mesh | Find the metrics exceptions"
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    label_selectors: [erag-metrics-exception=true]
  loop:
    - {api_version: security.istio.io/v1, kind: PeerAuthentication}
    - {api_version: networking.k8s.io/v1, kind: NetworkPolicy}
  loop_control:
    label: "{{ item.kind }}"
  register: _mesh_existing

# A workload no longer deployed, or an entry renamed or dropped from the list.
- name: "app_post_install | mesh | Remove the exceptions this run did not create"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace }}"
  loop: "{{ _mesh_existing.results | map(attribute='resources') | flatten }}"
  loop_control:
    label: "{{ item.kind }} {{ item.metadata.namespace }}/{{ item.metadata.name }}"
  vars:
    _mesh_wanted: >-
      {%- set out = [] -%}
      {%- for r in _mesh_deployed -%}
      {%- set _ = out.append(r.item.namespace ~ '/' ~ r.item.name ~ '-metrics') -%}
      {%- endfor -%}
      {{ out }}
  when: (item.metadata.namespace ~ '/' ~ item.metadata.name) not in _mesh_wanted
