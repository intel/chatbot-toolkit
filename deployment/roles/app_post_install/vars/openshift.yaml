---
# The user-workload Prometheus scrapes from outside the STRICT mesh. Each entry opens
# one workload's metrics port to the monitoring namespaces only. `probed`: the kubelet's
# probes call the port too. `probe_ports`: ports only the probes call, open to any
# source (ztunnel lets probes in as plain TCP and refuses any other plain TCP).
# The GMC controller's metrics port is opened by app_pipeline, with its webhook.
# Workloads not listed (audio, MSSQL) are not scraped under STRICT yet.
_post_install_metrics_exceptions:
  - name: chat-history
    namespace: "{{ chat_history_namespace }}"
    pods: {app.kubernetes.io/name: chat-history, app.kubernetes.io/instance: chat-history}
    port: 6012
    probed: true
  - name: fingerprint
    namespace: "{{ fingerprint_namespace }}"
    pods: {app.kubernetes.io/name: fingerprint, app.kubernetes.io/instance: fingerprint}
    port: 6012
    probed: true
  - name: nats
    namespace: "{{ nats_namespace }}"
    pods: {app.kubernetes.io/name: nats, app.kubernetes.io/instance: nats}
    port: 7777
    probe_ports: [8222]
  - name: redis-cluster
    namespace: "{{ vector_databases_namespace }}"
    pods: {app.kubernetes.io/name: redis-cluster, app.kubernetes.io/instance: vdb}
    port: 9121
    probed: true
  - name: router-service
    namespace: "{{ pipeline_namespace }}"
    pods: {app: router-service}
    port: 8080
    probed: true
  - name: embedding-usvc
    namespace: "{{ pipeline_namespace }}"
    pods: {app: embedding-svc}
    port: 6000
    probed: true
  - name: in-guard-usvc
    namespace: "{{ pipeline_namespace }}"
    pods: {app: input-scan-svc}
    port: 8050
    probed: true
  - name: llm-usvc
    namespace: "{{ pipeline_namespace }}"
    pods: {app: llm-svc}
    port: 9000
    probed: true
  - name: prompt-template-usvc
    namespace: "{{ pipeline_namespace }}"
    pods: {app: prompt-template-svc}
    port: 7900
    probed: true
  - name: reranking-usvc
    namespace: "{{ pipeline_namespace }}"
    pods: {app: reranking-svc}
    port: 8000
    probed: true
  - name: retriever-usvc
    namespace: "{{ pipeline_namespace }}"
    pods: {app: retriever-svc}
    port: 6620
    probed: true
  - name: edp-backend
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-backend, app.kubernetes.io/instance: edp}
    port: 5000
    probed: true
  - name: edp-celery
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-celery, app.kubernetes.io/instance: edp}
    port: 5000
  - name: edp-flower
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-flower, app.kubernetes.io/instance: edp}
    port: 5555
    probed: true
  - name: edp-ingestion
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-ingestion, app.kubernetes.io/instance: edp}
    port: 6120
    probed: true
  - name: edp-text-compression
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-text-compression, app.kubernetes.io/instance: edp}
    port: 9397
    probed: true
  - name: edp-text-extractor
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-text-extractor, app.kubernetes.io/instance: edp}
    port: 9398
    probed: true
  - name: edp-text-splitter
    namespace: "{{ edp_namespace }}"
    pods: {app.kubernetes.io/name: edp-text-splitter, app.kubernetes.io/instance: edp}
    port: 9399
    probed: true
# The kubelet's probes reach the pod from the address istio-cni SNATs them to:
# HOST_PROBE_SNAT_IP on the admin's IstioCNI, read by tasks/mesh_metrics.yaml. A
# `probed` port admits it.
_post_install_probe_address: >-
  {{ _mesh_istio_cni.resources | default([])
     | map(attribute='spec.values.cni.env.HOST_PROBE_SNAT_IP', default='') | first | default('') }}
