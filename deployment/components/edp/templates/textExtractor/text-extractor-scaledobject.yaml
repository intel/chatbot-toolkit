{{- if include "helm-edp.textExtractor.keda" . }}
{{- $name := include "helm-edp.textExtractor.scaledName" . }}
{{- $hpa := ((.Values).textExtractor).hpa | default dict }}
{{- $down := toString ($hpa.scaleDownTargetValue | default "500m") }}
{{- if hasSuffix "m" $down }}{{ $down = toString (divf (trimSuffix "m" $down | float64) 1000) }}{{ end }}
{{- /* The queues of the Prometheus Adapter rules (components/hpa/prometheus_adapter.yaml),
       in this order: the HPA dashboard (gmc) names KEDA's s0 and s1 metrics after them. */}}
{{- $triggers := list
      (dict "name" "files-to-upload" "threshold" (toString ($hpa.scaleUpTargetValue | default 2))
            "query" `sum(edp_files_uploaded_total{service="edp-backend"}) + sum(edp_links_uploaded_total{service="edp-backend"})`)
      (dict "name" "files-active" "threshold" $down
            "query" `sum(edp_files_uploaded_total{service="edp-backend"}) + sum(edp_files_text_extracting_total{service="edp-backend"}) + sum(edp_links_uploaded_total{service="edp-backend"}) + sum(edp_links_text_extracting_total{service="edp-backend"})`) }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "helm-edp.selectorLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicaCount: {{ $hpa.minReplicas | default 1 }}
  maxReplicaCount: {{ $hpa.maxReplicas | default 4 }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- include "helm-edp.textExtractor.hpaBehavior" . | nindent 8 }}
  # metricType Value: the HPA scales on value / target times the current
  # replicas, as for the Object metrics of the Prometheus Adapter.
  triggers:
    {{- range $triggers }}
    - type: prometheus
      name: {{ .name }}
      metricType: Value
      metadata:
        serverAddress: {{ $.Values.keda.prometheus.serverAddress | quote }}
        namespace: {{ $.Release.Namespace }}
        authModes: bearer
        query: {{ .query }}
        threshold: {{ .threshold | quote }}
      authenticationRef:
        name: {{ $name }}-prometheus
    {{- end }}
{{- end }}
