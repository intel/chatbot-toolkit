{{- if eq .Values.vectorStore "redis-cluster" }}
{{- $redisCluster := index .Values "redis-cluster" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Namespace }}-redis-cluster-init
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cluster-init
spec:
  backoffLimit: 10
  template:
    metadata:
      {{- with .Values.jobPodAnnotations }}
      # The Job ends only when its sidecar does: native sidecars do.
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: redis-cluster
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cluster-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $redisCluster.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: cluster-init
        image: "{{ $redisCluster.redis.image.repository }}:{{ $redisCluster.redis.image.tag | default "latest" }}"
        imagePullPolicy: {{ $redisCluster.redis.image.pullPolicy | default "IfNotPresent" }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $redisCluster.existingSecret }}
              key: {{ $redisCluster.existingSecretPasswordKey }}
        - name: CLUSTER_NODES
          value: {{ $redisCluster.cluster.nodes | quote }}
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secrets
          mountPath: /secrets
          readOnly: true
        command:
        - sh
        - -c
        - |
          set -e
          
          echo "=== Redis Cluster Initialization ==="
          echo ""
          
          # Wait for all pods to be ready
          echo "Waiting for all Redis pods to be ready..."
          for i in $(seq 0 $((CLUSTER_NODES - 1))); do
            NODE_DNS="vdb-redis-cluster-${i}.vdb-redis-cluster-headless.${NAMESPACE}.svc.cluster.local"
            until redis-cli -h "$NODE_DNS" -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; do
              echo "  Waiting for ${NODE_DNS}..."
              sleep 2
            done
            echo "  ✅ ${NODE_DNS} is ready"
          done
          echo ""
          {{- if $redisCluster.cluster.joinRepair }}
          
          FIRST_NODE="vdb-redis-cluster-0.vdb-redis-cluster-headless.${NAMESPACE}.svc.cluster.local"
          cli() { node=$1; shift; redis-cli -h "$node" -a "$REDIS_PASSWORD" --no-auth-warning "$@"; }
          info() { cli "$FIRST_NODE" CLUSTER INFO 2>/dev/null | grep "^$1:" | cut -d':' -f2 | tr -d '\r\n ' || true; }

          SLOTS_ASSIGNED=$(info cluster_slots_assigned)
          echo "Slots assigned: ${SLOTS_ASSIGNED:-0} / 16384"
          echo ""

          if [ "${SLOTS_ASSIGNED:-0}" -eq 0 ]; then
            CLUSTER_IPS=""
            for i in $(seq 0 $((CLUSTER_NODES - 1))); do
              CLUSTER_IPS="$CLUSTER_IPS vdb-redis-cluster-${i}.vdb-redis-cluster-headless.${NAMESPACE}.svc.cluster.local:6379"
            done
            echo "No cluster detected. Creating it with nodes:$CLUSTER_IPS"
            echo ""
            redis-cli -a "$REDIS_PASSWORD" --cluster create $CLUSTER_IPS \
              --cluster-replicas 0 \
              --cluster-yes || echo "Cluster creation incomplete; joining the missing nodes below"
            # Slots assigned means the create got far enough for the joins below to finish it.
            SLOTS_ASSIGNED=$(info cluster_slots_assigned)
            if [ "${SLOTS_ASSIGNED:-0}" -eq 0 ]; then
              echo "❌ Cluster creation failed: no slots assigned"
              exit 1
            fi
          fi

          # A node can miss the join and keep its slots to itself: in a mesh, the first
          # connections of a new pod can be refused until the pod's identity is known,
          # and Redis does not retry a MEET. The first node meets every node it does not
          # know, until it knows all nodes and all slots are served.
          for attempt in $(seq 1 30); do
            STATE=$(info cluster_state)
            SLOTS=$(info cluster_slots_assigned)
            KNOWN=$(info cluster_known_nodes)
            if [ "$STATE" = "ok" ] && [ "$SLOTS" = "16384" ] && [ "${KNOWN:-0}" -ge "$CLUSTER_NODES" ]; then
              echo "✅ Cluster ready"
              echo ""
              cli "$FIRST_NODE" CLUSTER NODES 2>/dev/null
              exit 0
            fi
            echo "Cluster incomplete (state=${STATE:-?}, slots ${SLOTS:-0}/16384, nodes ${KNOWN:-0}/${CLUSTER_NODES}), attempt ${attempt}/30"
            KNOWN_ADDRS=$(cli "$FIRST_NODE" CLUSTER NODES 2>/dev/null | awk '{print $2}' | cut -d'@' -f1 || true)
            for i in $(seq 1 $((CLUSTER_NODES - 1))); do
              NODE_IP=$(getent hosts "vdb-redis-cluster-${i}.vdb-redis-cluster-headless.${NAMESPACE}.svc.cluster.local" | awk '{print $1}' || true)
              if [ -n "$NODE_IP" ] && ! echo "$KNOWN_ADDRS" | grep -qx "${NODE_IP}:6379"; then
                echo "  Meeting vdb-redis-cluster-${i} (${NODE_IP})"
                cli "$FIRST_NODE" CLUSTER MEET "$NODE_IP" 6379 16379 || true
              fi
            done
            sleep 5
          done

          echo "❌ Cluster not ready"
          cli "$FIRST_NODE" CLUSTER NODES 2>/dev/null || true
          exit 1
          {{- else }}
          
          # Check if cluster already exists
          FIRST_NODE="vdb-redis-cluster-0.vdb-redis-cluster-headless.${NAMESPACE}.svc.cluster.local"
          CLUSTER_STATE=$(redis-cli -h "$FIRST_NODE" -a "$REDIS_PASSWORD" CLUSTER INFO 2>/dev/null | grep "cluster_state:" | cut -d':' -f2 | tr -d '\r\n ' || echo "")
          SLOTS_ASSIGNED=$(redis-cli -h "$FIRST_NODE" -a "$REDIS_PASSWORD" CLUSTER INFO 2>/dev/null | grep "cluster_slots_assigned:" | cut -d':' -f2 | tr -d '\r\n ' || echo "0")
          
          echo "Current cluster state: $CLUSTER_STATE"
          echo "Slots assigned: $SLOTS_ASSIGNED / 16384"
          echo ""
          
          # If cluster already has slots assigned, do nothing
          if [ "$SLOTS_ASSIGNED" -gt "0" ]; then
            echo "✅ Cluster already exists (has $SLOTS_ASSIGNED slots). Nothing to do."
            echo ""
            redis-cli -h "$FIRST_NODE" -a "$REDIS_PASSWORD" CLUSTER NODES 2>/dev/null
            exit 0
          fi
          
          # Create new cluster
          echo "No cluster detected. Creating new cluster..."
          echo ""
          
          # Build node list
          CLUSTER_IPS=""
          for i in $(seq 0 $((CLUSTER_NODES - 1))); do
            NODE_DNS="vdb-redis-cluster-${i}.vdb-redis-cluster-headless.${NAMESPACE}.svc.cluster.local"
            CLUSTER_IPS="$CLUSTER_IPS $NODE_DNS:6379"
          done
          
          echo "Creating cluster with nodes:$CLUSTER_IPS"
          echo ""
          
          redis-cli -a "$REDIS_PASSWORD" --cluster create $CLUSTER_IPS \
            --cluster-replicas 0 \
            --cluster-yes
          
          # Verify creation
          sleep 5
          FINAL_STATE=$(redis-cli -h "$FIRST_NODE" -a "$REDIS_PASSWORD" CLUSTER INFO 2>/dev/null | grep "cluster_state:" | cut -d':' -f2 | tr -d '\r\n ')
          FINAL_SLOTS=$(redis-cli -h "$FIRST_NODE" -a "$REDIS_PASSWORD" CLUSTER INFO 2>/dev/null | grep "cluster_slots_assigned:" | cut -d':' -f2 | tr -d '\r\n ')
          
          echo ""
          if [ "$FINAL_STATE" = "ok" ] && [ "$FINAL_SLOTS" = "16384" ]; then
            echo "✅ Cluster created successfully!"
            echo ""
            redis-cli -h "$FIRST_NODE" -a "$REDIS_PASSWORD" CLUSTER NODES 2>/dev/null
            exit 0
          else
            echo "❌ Cluster creation failed"
            exit 1
          fi
          {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: secrets
        secret:
          secretName: {{ $redisCluster.existingSecret }}
          items:
          - key: {{ $redisCluster.existingSecretPasswordKey }}
            path: password
{{- end }}
