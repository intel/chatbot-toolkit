#
# Expected cluster state after an es_auto_installer.sh layered teardown.
# Consumed by test_uninstall.py, selected via the CLUSTER_STATE env var
# (erag | inference | platform | all). Driven by run_scenario.py from
# scenarios.yaml (SCENARIO=uninstall, CLUSTER_STATE=<layer>).
#
# Per layer:
#   removed_namespaces  - MUST be absent after the teardown (also flags stuck Terminating)
#   removed_crd_groups  - CRD API groups owned by the layer that MUST be gone
#                         (helm does NOT delete CRDs on uninstall; a leftover here is an
#                          incomplete teardown the roles should clean up explicitly)
#   retained_namespaces - lower layers that MUST still exist (single-layer teardown in CI:
#                         full install, then tear down one layer top-down)
#   allowed_namespaces  - ('all' only) the only namespaces permitted after a full teardown
#   openshift           - keys that replace the ones above on OpenShift, where the cluster's
#                         own operators provide what this installer deploys on Kubernetes
#                         (OpenShift AI's KServe, the LeaderWorkerSet, NFD, cert-manager, Service
#                         Mesh and CloudNativePG operators, the admin's istio-system and keycloak)
#
# NOTE: the map is intentionally strict — it asserts the *fully clean* end-state.

layers:

  erag:
    removed_namespaces:
      - auth-apisix
      - chat-history
      - chatqna
      - edp
      - fingerprint
      - mcp-gateway
      - nats
      - rag-ui
      - seaweedfs
      - vdb
      - system
    removed_crd_groups:
      - apisix.apache.org
    retained_namespaces:      # inference + platform still installed below erag
      - kserve
      - istio-system
    openshift:
      retained_namespaces:    # KServe is OpenShift AI's, outside the inference layer
        - llm-inference
        - istio-system

  inference:
    removed_namespaces:
      - kserve
      - litellm
      - langfuse
      - llm-inference
      - envoy-ai-gateway-system
      - lws-system
    removed_crd_groups:
      - serving.kserve.io
      - aigateway.envoyproxy.io
      - leaderworkerset.x-k8s.io
    retained_namespaces:      # platform still installed below inference
      - istio-system
      - cert-manager
      - node-feature-discovery
    openshift:
      removed_crd_groups:     # serving.kserve.io and leaderworkerset.x-k8s.io are the operators'
        - aigateway.envoyproxy.io
      retained_namespaces:
        - istio-system
        - cert-manager
        - openshift-nfd       # NFD from its OLM operator

  platform:
    removed_namespaces:
      - cert-manager
      - cnpg-system
      - envoy-gateway-system
      - istio-system
      - keycloak
      - metallb-system
      - minio
      - monitoring
      - node-feature-discovery
      - postgresql
    removed_crd_groups:
      - cert-manager.io
      - monitoring.coreos.com
      - metallb.io
      - postgresql.cnpg.io
      - config.nri            # nri_cpu_balloons is a platform component; teardown inference keeps it
      - gateway.envoyproxy.io
      - networking.istio.io
      - security.istio.io
      - telemetry.istio.io
      - nfd.k8s-sigs.io
    retained_namespaces: []   # only infrastructure (bare cluster) remains
    openshift:
      removed_namespaces:     # cert-manager is its operator's, istio-system and keycloak the admin's
        - cnpg-system
        - envoy-gateway-system
        - metallb-system
        - minio
        - monitoring
        - node-feature-discovery
        - postgresql
      removed_crd_groups:     # the operators' and cluster monitoring's groups stay
        - metallb.io
        - config.nri
        - gateway.envoyproxy.io

  all:
    # Full teardown (teardown --all): only base Kubernetes / node namespaces may remain.
    allowed_namespaces:
      - default
      - kube-system
      - kube-public
      - kube-node-lease
      - local-path-storage
