name: "Val :: Unit tests"

on:
  push:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; every push to main/release keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: "Unit tests"
    runs-on: intel-ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    # Runs as root: some tox envs apt-install system packages in commands_pre.
    container: python:3.12-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get -y install --no-install-recommends libgl1 build-essential

      # Versions must match [tox] requires in src/tox.ini, otherwise tox
      # provisions a second copy of itself in .tox/.tox on every run.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.17"
          enable-cache: true
          cache-python: true

      - name: Install tox
        id: tox
        run: |
          uv tool install tox==4.30.2 --with tox-uv==1.28.0 --with uv==0.8.17
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: asr_unit_tests
        if: ${{ !cancelled() && steps.tox.outcome == 'success' }}
        working-directory: src
        run: tox run -e asr_unit_tests

      - name: chat_history_unit_tests
        if: ${{ !cancelled() && steps.tox.outcome == 'success' }}
        working-directory: src
        run: tox run -e chat_history_unit_tests

      - name: cores_unit_tests
        if: ${{ !cancelled() && steps.tox.outcome == 'success' }}
        working-directory: src
        run: tox run -e cores_unit_tests

      - name: deployment_scripts_unit_tests
        if: ${{ !cancelled() && steps.tox.outcome == 'success' }}
        working-directory: src
        run: tox run -e deployment_scripts_unit_tests

      - name: docsum_unit_tests
        if: ${{ !cancelled() && steps.tox.outcome == 'success' }}
        working-directory: src
        run: tox run -e docsum_unit_tests

      - name: edp_unit_tests
